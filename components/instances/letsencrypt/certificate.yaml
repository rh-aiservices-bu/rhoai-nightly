# The cert-manager instance (certmanagers.operator.openshift.io/cluster) has
# no namespace restriction, so the Certificate lives in openshift-ingress, the
# namespace of its consumers: the ingress router (defaultCertificate, see
# ingresscontroller-default-cert.yaml) and the MaaS Gateway listener
# (instance-maas-gateway) both consume this secret directly.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: apps-wildcard-tls
  namespace: openshift-ingress
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  secretName: apps-wildcard-tls
  dnsNames:
    - "*.apps.cluster.nightly.rhai-tmm.dev"
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
