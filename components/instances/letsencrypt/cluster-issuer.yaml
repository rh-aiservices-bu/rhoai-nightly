# Let's Encrypt production ClusterIssuer on the platform cert-manager instance.
# DNS-01 only: hosts like maas.apps.cluster.nightly.rhai-tmm.dev resolve to the
# Gateway ELB rather than the ingress router, so HTTP-01 challenges can never
# reach the router for the names this rig serves. The Route53 zone is
# nightly.rhai-tmm.dev (awsdns NS records); solver.dnsZones pins it so the
# solver only answers challenges for that authoritative zone (matching the
# reference chart's requirement for dns-type solvers) — zone discovery is
# otherwise used by default; pin solver.route53.hostedZoneID instead if
# discovery ever mis-resolves.
# The Route53 credential secret is provisioned out-of-band by `make le-creds`.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: jharmison@redhat.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          route53:
            region: us-east-2
            dnsZones:
              - nightly.rhai-tmm.dev
            accessKeyIDSecretRef:
              name: letsencrypt-route53-credentials
              key: aws-access-key-id
            secretAccessKeySecretRef:
              name: letsencrypt-route53-credentials
              key: aws-secret-access-key
