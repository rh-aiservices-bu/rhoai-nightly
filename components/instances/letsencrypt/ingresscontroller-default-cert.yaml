# Sideloads the LE wildcard as the ingress router default certificate: when a
# custom defaultCertificate is set, the ingress operator retires
# router-certs-default and mounts this secret on the routers directly. The MaaS
# Gateway listener references apps-wildcard-tls directly (instance-maas-gateway).
apiVersion: operator.openshift.io/v1
kind: IngressController
metadata:
  name: default
  namespace: openshift-ingress-operator
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  defaultCertificate:
    name: apps-wildcard-tls
