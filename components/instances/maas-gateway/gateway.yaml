# Declarative replacement for the legacy instance-maas Helm chart Gateway.
# The AITenant/MaasTenantConfig controllers require this exact name and
# namespace (controller defaults). The MaaS Gateway's class is
# `data-science-gateway-class`; `openshift-default` also exists on OCP 5,
# created by `components/operators/connectivity-link/gatewayclass.yaml` as the
# RHCL provider-enablement trigger (no `gatewayClassName` references it). The
# chart's own `openshift-default` template is the OCP 4.20-era legacy path.
# The listener hostname is the cluster-specific field —
# kept flat deliberately; patch it in a per-cluster overlay if running
# elsewhere. The HTTPS listener references the LE wildcard secret
# `apps-wildcard-tls` directly: once a custom `defaultCertificate` is set,
# the ingress operator retires `router-certs-default` and mounts the custom
# secret on the routers, so there is nothing to inherit from. The letsencrypt
# component (instance-letsencrypt) owns that secret's lifecycle.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: maas-default-gateway
  namespace: openshift-ingress
  annotations:
    opendatahub.io/managed: "false"
spec:
  gatewayClassName: data-science-gateway-class
  listeners:
    - name: http
      hostname: "maas.apps.cluster.nightly.rhai-tmm.dev"
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      hostname: "maas.apps.cluster.nightly.rhai-tmm.dev"
      port: 443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - group: ""
            kind: Secret
            name: apps-wildcard-tls
        mode: Terminate
