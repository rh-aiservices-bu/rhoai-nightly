apiVersion: v1
kind: ConfigMap
metadata:
  name: maas-default-gateway-options
  namespace: openshift-ingress
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  # Referenced by maas-default-gateway's spec.infrastructure.parametersRef.
  # The openshift.io/gateway-controller (OSSM/istio Gateway API) merges the
  # `service` value into the generated gateway Service as a strategic-merge
  # patch. (A `deployment` key raising istio-proxy memory to 2Gi was carried
  # here as workaround A2 until 2026-10-16 — retired once RHCL 1.4.3 brought
  # the proxy back under the 1Gi default; see docs/workarounds.md.)
  #
  # The `service` patch carries metadata.annotations ONLY — no spec.type key, so the Service stays the
  # default LoadBalancer. The cross-zone annotation works around the AWS
  # classic ELB the cloud provider builds for an annotation-less Service:
  # cross-zone balancing is off by default, and the ELB can enroll an AZ
  # that holds no cluster instances — that AZ's LB IP then black-holes TLS
  # and ~half of external requests hang (observed tm9xb 2026-07-31: one of
  # two ELB IPs timed out for 30+ min; annotation fixed it instantly).
  # See docs/issues/gateway-elb-crosszone-blackhole.md. Remove the service
  # key when the openshift gateway controller provisions LBs that serve
  # from every enrolled AZ by default.
  service: |
    metadata:
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
