apiVersion: nvidia.com/v1
kind: ClusterPolicy
metadata:
  name: gpu-cluster-policy
spec:
  vgpuDeviceManager:
    repository: nvcr.io/nvidia/cloud-native
    image: vgpu-device-manager
    version: v0.5.2
    config:
      default: default
    enabled: true
  migManager:
    repository: nvcr.io/nvidia/cloud-native
    image: k8s-mig-manager
    version: v0.15.2
    config:
      default: all-disabled
      name: default-mig-parted-config
    enabled: true
  operator:
    defaultRuntime: crio
    initContainer: {}
    runtimeClass: nvidia
    use_ocp_driver_toolkit: true
  dcgm:
    repository: nvcr.io/nvidia/cloud-native
    image: dcgm
    version: 4.7.0-ubuntu24.04
    enabled: true
  gfd:
    repository: nvcr.io/nvidia
    image: k8s-device-plugin
    version: v0.20.2
    enabled: true
  dcgmExporter:
    repository: nvcr.io/nvidia/k8s
    image: dcgm-exporter
    version: 4.7.0-4.9.0-distroless
    config:
      name: ''
    serviceMonitor:
      enabled: true
    enabled: true
  cdi:
    default: false
    enabled: true
  # Component images are pinned explicitly: the GPU operator on this rig is
  # helm-installed, and no OLM CSV exists to inject component images through
  # operator env vars, so the ClusterPolicy carries every image path itself.
  # Driver 615.71.10 is required on amd64 DTK mode: older rhel10 driver
  # images crash-loop (NVIDIA/gpu-driver-container#984).
  driver:
    repository: nvcr.io/nvidia
    image: driver
    version: 615.71.10
    licensingConfig:
      nlsEnabled: true
      secretName: ''
    kernelModuleType: auto
    certConfig:
      name: ''
    kernelModuleConfig:
      name: ''
    upgradePolicy:
      autoUpgrade: true
      drain:
        deleteEmptyDir: false
        enable: false
        force: false
        timeoutSeconds: 300
      maxParallelUpgrades: 1
      maxUnavailable: 25%
      podDeletion:
        deleteEmptyDir: false
        force: false
        timeoutSeconds: 300
      waitForCompletion:
        timeoutSeconds: 0
    repoConfig:
      configMapName: ''
    virtualTopology:
      config: ''
    enabled: true
    useNvidiaDriverCRD: false
  devicePlugin:
    repository: nvcr.io/nvidia
    image: k8s-device-plugin
    version: v0.20.2
    config:
      name: ''
      default: ''
    mps:
      root: /run/nvidia/mps
    enabled: true
  gdrcopy:
    enabled: false
  kataManager:
    config:
      artifactsDir: /opt/nvidia-gpu-operator/artifacts/runtimeclasses
  mig:
    strategy: single
  sandboxDevicePlugin:
    repository: nvcr.io/nvidia
    image: kubevirt-gpu-device-plugin
    version: v1.6.1
    enabled: true
  validator:
    repository: nvcr.io/nvidia
    image: gpu-operator
    version: v26.7.3
    plugin:
      env: []
  nodeStatusExporter:
    repository: nvcr.io/nvidia
    image: gpu-operator
    version: v26.7.3
    enabled: true
  daemonsets:
    rollingUpdate:
      maxUnavailable: '1'
    updateStrategy: RollingUpdate
  sandboxWorkloads:
    defaultWorkload: container
    enabled: false
  gds:
    enabled: false
  vgpuManager:
    enabled: false
  vfioManager:
    repository: nvcr.io/nvidia/cloud-native
    image: k8s-driver-manager
    version: v0.12.1
    enabled: true
  toolkit:
    repository: nvcr.io/nvidia/k8s
    image: container-toolkit
    version: v1.20.2
    installDir: /usr/local/nvidia
    enabled: true
