kind: DataScienceCluster
apiVersion: datasciencecluster.opendatahub.io/v2
metadata:
  name: default-dsc
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: datasciencecluster
spec:
  components:
    aipipelines:
      managementState: Managed
    dashboard:
      managementState: Managed
    feastoperator:
      managementState: Managed
    # RHOAI 3.6+: MaaS lives under aigateway.modelsAsAService (the deprecated
    # kserve.modelsAsService is silently ignored on 3.6 —
    # docs/issues/dsc-maas-deprecated-field-ignored.md). overlays/maas flips
    # BOTH states to Managed: an explicit aigateway.managementState=Removed
    # disables the whole AI Gateway module, MaaS included.
    aigateway:
      managementState: Removed
      modelsAsAService:
        managementState: Removed
    mcplifecycleoperator:
      managementState: Managed
    kserve:
      managementState: Managed
      nim:
        managementState: Managed
      rawDeploymentServiceConfig: Headed
    kueue:
      defaultClusterQueueName: default
      defaultLocalQueueName: default
      managementState: Removed
    mlflowoperator:
      managementState: Managed
    ogx:
      # Intentional configuration (not a workaround): ogx provides the
      # LlamaStack operator + distribution behind the Gen AI Studio Playground.
      # The product default is Removed; this rig wants the Playground, so we
      # opt in.
      managementState: Managed
    modelregistry:
      managementState: Managed
      registriesNamespace: rhoai-model-registries
    ray:
      managementState: Managed
    trainer:
      managementState: Managed
    trainingoperator:
      managementState: Managed
    trustyai:
      eval:
        lmeval:
          permitCodeExecution: deny
          permitOnline: deny
      managementState: Managed
    workbenches:
      managementState: Managed
      workbenchNamespace: rhods-notebooks
