kind: DataScienceCluster
apiVersion: datasciencecluster.opendatahub.io/v2
metadata:
  name: default-dsc
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: datasciencecluster
spec:
  components:
    # RHOAI 3.6+: MaaS lives under aigateway.modelsAsAService. The old
    # kserve.modelsAsService below is deprecated and kept at Removed as the
    # operator asks ("Clear to Removed after migration"); on 3.6 EA2 it is
    # silently ignored anyway (docs/issues/dsc-maas-deprecated-field-ignored.md).
    # overlays/maas flips both aigateway states to Managed.
    aigateway:
      managementState: Removed
      modelsAsAService:
        managementState: Removed
    aipipelines:
      managementState: Managed
    dashboard:
      managementState: Managed
    feastoperator:
      managementState: Managed
    kserve:
      managementState: Managed
      modelsAsService:
        managementState: Removed
      nim:
        managementState: Managed
      rawDeploymentServiceConfig: Headed
    kueue:
      defaultClusterQueueName: default
      defaultLocalQueueName: default
      managementState: Removed
    mlflowoperator:
      managementState: Managed
    ogx:
      # Intentional configuration (not a workaround): ogx provides the
      # LlamaStack operator + distribution behind the Gen AI Studio Playground.
      # The product default is Removed; this rig wants the Playground, so we
      # opt in.
      managementState: Managed
    modelregistry:
      managementState: Managed
      registriesNamespace: rhoai-model-registries
    ray:
      managementState: Managed
    trainer:
      managementState: Managed
    trainingoperator:
      managementState: Managed
    trustyai:
      eval:
        lmeval:
          permitCodeExecution: deny
          permitOnline: deny
      managementState: Managed
    workbenches:
      managementState: Managed
      workbenchNamespace: rhods-notebooks
