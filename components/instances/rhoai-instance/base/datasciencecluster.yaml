kind: DataScienceCluster
apiVersion: datasciencecluster.opendatahub.io/v3
metadata:
  name: default-dsc
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: datasciencecluster
spec:
  components:
    aipipelines:
      managementState: Managed
    # v3 splits the dashboard component: `standard` is the classic dashboard,
    # `maasPortal` is the MaaS portal (not enabled here).
    dashboard:
      standard:
        managementState: Managed
    # `data.featureStore` is v3's feature store component; v2 named it
    # `feastoperator`.
    data:
      featureStore:
        managementState: Managed
    # RHOAI 3.6+: MaaS lives under aigateway.modelsAsAService. overlays/maas
    # flips BOTH states to Managed: an explicit aigateway.managementState=Removed
    # disables the whole AI Gateway module, MaaS included.
    aigateway:
      managementState: Removed
      modelsAsAService:
        managementState: Removed
    mcplifecycleoperator:
      managementState: Managed
    kserve:
      managementState: Managed
      nim:
        managementState: Managed
      rawDeploymentServiceConfig: Headed
    kueue:
      defaultClusterQueueName: default
      defaultLocalQueueName: default
      managementState: Removed
    mlflowoperator:
      managementState: Managed
    ogx:
      # Intentional configuration (not a workaround): ogx provides the
      # LlamaStack operator + distribution behind the Gen AI Studio Playground.
      # The product default is Removed; this rig wants the Playground, so we
      # opt in.
      managementState: Managed
    # v3 replaces the v2 `modelregistry` component with `aiHub` (the model
    # catalog/registry); instancesNamespace hosts the registry resources.
    aiHub:
      managementState: Managed
      instancesNamespace: rhoai-model-registries
    ray:
      managementState: Managed
    trainer:
      managementState: Managed
    # v3 has no `trainingoperator` component; Trainer (v2) above is the only
    # supported path (Training Operator v1 is rejected as Managed by the
    # 3.6 webhook).
    trustyai:
      eval:
        lmeval:
          permitCodeExecution: deny
          permitOnline: deny
      managementState: Managed
    workbenches:
      managementState: Managed
      workbenchNamespace: rhods-notebooks
