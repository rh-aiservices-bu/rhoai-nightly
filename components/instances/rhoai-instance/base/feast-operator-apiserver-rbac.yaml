# WORKAROUND (see docs/known-issues.md §A9) — RHOAI 3.5.0 nightly.
#
# The feast controller (`feast-operator-controller-manager`, deployed by the
# FeastOperator CR that the DSC-owned `opendatahub-feast-operator` creates) reads
# the cluster APIServer TLS profile at startup and hard-exits if it cannot:
#
#   ERROR setup  unable to read APIServer TLS profile, refusing to start with
#   unknown TLS posture  {"error": "apiservers.config.openshift.io \"cluster\" is
#   forbidden: User \"system:serviceaccount:redhat-ods-applications:\
#   feast-operator-controller-manager\" cannot get resource \"apiservers\" in API
#   group \"config.openshift.io\" at the cluster scope"}
#
# Neither operator-shipped ClusterRole (`feast-operator-manager-role`,
# `opendatahub-feast-manager-role`) grants it, so the pod CrashLoopBackOffs and
# `DataScienceCluster/default-dsc` stays Ready=False on `feastoperator` — which
# makes the observability settle-gate in scripts/install-observability.sh abort.
#
# This is additive to the operator's own roles (RBAC rules union), so it does not
# fight the operator's reconcile.
#
# Remove when the RHOAI operator CSV grants config.openshift.io/apiservers get.
#
# SECOND GAP (2026-07-31, rhods-operator.3.5.0 GA, cluster-fzgjg): the same
# controller now also runs a "Notebook ConfigMap controller" that watches
# notebooks.kubeflow.org cluster-wide. On startup it logs
#   "Unable to validate Notebook CRD (insufficient permissions), will attempt setup"
# then proceeds anyway; the notebook cache group can never sync
#   "failed to wait for notebook caches to sync kind source: *v1.FeatureStore /
#    *v1.ConfigMap: timed out waiting for cache to be synced"
# and the manager exits -> CrashLoopBackOff. Neither operator-shipped
# ClusterRole grants notebooks.kubeflow.org. Same remove-condition as above but
# for kubeflow.org/notebooks.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: feast-operator-apiserver-reader
  labels:
    app.kubernetes.io/part-of: rhoai-instance
    app.kubernetes.io/managed-by: rhoai-nightly-workaround
rules:
  - apiGroups:
      - config.openshift.io
    resources:
      - apiservers
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - kubeflow.org
    resources:
      - notebooks
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: feast-operator-apiserver-reader
  labels:
    app.kubernetes.io/part-of: rhoai-instance
    app.kubernetes.io/managed-by: rhoai-nightly-workaround
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: feast-operator-apiserver-reader
subjects:
  - kind: ServiceAccount
    name: feast-operator-controller-manager
    namespace: redhat-ods-applications
