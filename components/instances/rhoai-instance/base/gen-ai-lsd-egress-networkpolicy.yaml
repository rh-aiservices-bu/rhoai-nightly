# WORKAROUND (see docs/known-issues.md §A10) — RHOAI 3.5.0 nightly.
#
# The Gen AI Studio playground reads its model list from the LlamaStack
# distribution (OGXServer) running in the USER'S project namespace, via the
# dashboard BFF endpoint /gen-ai/api/v1/lsd/models. LlamaStack serves that on
# port 8321.
#
# The operator-shipped egress NetworkPolicy `gen-ai-allow-ports` (owned by
# Dashboard/default-dashboard) restricts gen-ai-ui egress to:
#
#     5353  -> openshift-dns
#     8243  -> maas-ui
#     8343  -> mlflow-ui
#     6443  -> any        (kube API)
#     443, 80 -> any
#
# Port 8321 is missing, so the BFF's call to
# lsd-genai-playground-service.<project>.svc:8321 is silently DROPPED. The
# request hangs until the gateway gives up and returns 504, the frontend's
# `models` list stays empty, and ChatbotMain renders "You need at least one
# model" — regardless of whether the project has AI assets or MaaS models.
#
# Diagnosed on cluster-r8mf7 2026-07-29:
#   pgvector pod -> LlamaStack (same ns)   HTTP 200 in 0.012s
#   gen-ai-ui    -> LlamaStack (cross ns)  HTTP 000, hangs 25s   <- dropped
#   No istio sidecars on either pod, and the target namespace's own ingress
#   policy already allows redhat-ods-applications on 8321 — so the egress side
#   is the only blocker.
#
# This affects EVERY project playground, not just MaaS-backed ones: /lsd/models
# is called whenever a playground has an LSD.
#
# WHAT THIS DOES
# --------------
# A second, additive NetworkPolicy selecting the same pods and allowing egress
# on 8321. Kubernetes unions egress rules across all policies that select a pod,
# so this grants the missing port without modifying (or fighting) the
# operator-owned policy, which is reconciled continuously.
#
# Scope: LlamaStack distributions are created on demand in arbitrary user project
# namespaces, so the destination cannot be pinned to a fixed namespace. It IS
# pinned to the LlamaStack pods themselves — `namespaceSelector: {}` combined with
# `podSelector: app=ogx` in a single `to` entry means "pods labelled app=ogx, in
# any namespace" (selectors within one `to` element are ANDed). That keeps the
# grant to TCP 8321 -> OGXServer pods only.
#
# Do NOT drop the `to:` block: an egress rule with ports but no `to` permits that
# port to EVERY destination, including off-cluster addresses.
#
# REMOVE THIS once the dashboard's own `gen-ai-allow-ports` includes 8321.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gen-ai-allow-llamastack-egress
  namespace: redhat-ods-applications
  labels:
    app.kubernetes.io/part-of: rhoai-instance
    app.kubernetes.io/managed-by: rhoai-nightly-workaround
spec:
  podSelector:
    matchLabels:
      deployment: gen-ai-ui
  policyTypes:
    - Egress
  egress:
    - to:
        # Both selectors in ONE list entry => AND: pods labelled app=ogx in any
        # namespace. Splitting them into two entries would OR them and re-open
        # the grant to every pod in every namespace.
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app: ogx
      ports:
        - port: 8321
          protocol: TCP
