apiVersion: opendatahub.io/v1alpha
kind: OdhDashboardConfig
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  name: odh-dashboard-config
  labels:
    app.kubernetes.io/part-of: rhods-dashboard
    app.opendatahub.io/rhods-dashboard: "true"
  namespace: redhat-ods-applications
spec:
  # On RHOAI 3.6 nightlies dashboard feature flags are module-federated
  # (DSC component gates + the Dashboard CR), so the OdhDashboardConfig flag
  # map is vestigial — deprecated keys (e.g. externalModels) are rejected by
  # CEL validation, and the rule errors ("no such key") even when evaluating
  # against a live object that lacks the key, which is why re-adding any
  # deprecated key hard-blocks ArgoCD sync. These two keys are kept explicit
  # because the operator writes them (matching values prevent ArgoCD drift).
  dashboardConfig:
    disableTracking: false
    workbenchesV2: false
  hardwareProfileOrder: []
  notebookController:
    enabled: true
    notebookNamespace: rhods-notebooks
    pvcSize: 20Gi
  templateDisablement: []
  templateOrder: []
