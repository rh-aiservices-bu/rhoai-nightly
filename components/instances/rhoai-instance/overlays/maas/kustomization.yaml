apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Overlay: MaaS enabled, monitoring cascade NOT triggered.
# Base has aigateway.modelsAsAService: Removed and DSCI monitoring.metrics unset.
# This overlay re-enables MaaS via the operator. The DSC's dashboard.maasPortal
# is operator-enforced — user-set values are reverted within seconds on this
# nightly (portal prerequisites per upstream contract were all satisfied at the
# time) — so do not patch it; portal enablement is tracked in
# docs/known-issues.md. Observability stays off; `make observability` flips
# the ArgoCD Application source to overlays/maas-observability for the full
# monitoring cascade.

resources:
  - ../../base

patches:
  - target:
      kind: DataScienceCluster
      name: default-dsc
    patch: |-
      - op: replace
        path: /spec/components/aigateway/managementState
        value: Managed
      - op: replace
        path: /spec/components/aigateway/modelsAsAService/managementState
        value: Managed
