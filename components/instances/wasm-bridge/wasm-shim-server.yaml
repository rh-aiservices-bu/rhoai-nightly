---
apiVersion: v1
kind: Service
metadata:
  name: wasm-shim-server
  namespace: openshift-operators
  labels:
    app: wasm-shim-server
    app.kubernetes.io/part-of: wasm-bridge
spec:
  selector:
    app: wasm-shim-server
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wasm-shim-server
  namespace: openshift-operators
  labels:
    app: wasm-shim-server
    app.kubernetes.io/part-of: wasm-bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wasm-shim-server
  template:
    metadata:
      labels:
        app: wasm-shim-server
        app.kubernetes.io/part-of: wasm-bridge
    spec:
      initContainers:
        - name: extract-shim
          image: registry.redhat.io/rhcl-1/rhcl-rhel9-operator@sha256:d297423e5507ec7ef5be128004902e3f62b5bf1d97f034d465c12628820ca299
          command: ["/bin/sh", "-c", "cp /wasm/plugin.wasm /wasm-out/plugin.wasm && sha256sum /wasm-out/plugin.wasm"]
          volumeMounts:
            - name: wasm
              mountPath: /wasm-out
      containers:
        - name: nginx
          image: registry.access.redhat.com/ubi8/nginx-122@sha256:abe58a16720c2ebd3b6823531fe5a1346bc512f561349c740c0dce0a407d2fd9
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: wasm
              mountPath: /opt/app-root/src
      volumes:
        - name: wasm
          emptyDir: {}
