apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Pinned RHOAI catalog overlay
# Uses a specific catalog image instead of floating nightly tag

resources:
  - ../../base

patches:
  - target:
      kind: CatalogSource
      name: rhoai-catalog-nightly
    patch: |-
      - op: replace
        path: /spec/image
        # Pinned to 3.5.0 released-track FBC - Aug 4, 2026 (sha256:f4183f7e).
        # Same digest as main's base pin (workarounds.md A12): first build with
        # the RHOAIENG-80043 EnvoyFilter workloadSelector fix (maas 58e59dec),
        # validated on cluster-tm9xb (diagnose 43/4/0, verify-maas 15/15).
        # No tag points here anymore (:rhoai-3.5 has moved on) — digest only.
        value: quay.io/rhoai/rhoai-fbc-fragment@sha256:f4183f7e1811e4d43d697dea8e764d6d8be02eeede69e540ac075d02081c804e
